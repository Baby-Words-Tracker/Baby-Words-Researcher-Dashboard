<section class="child-export" aria-labelledby="child-export-heading">
  <h3 id="child-export-heading">Export child word data</h3>
  <form [formGroup]="exportForm" (ngSubmit)="downloadFirstBatch()">
    <div class="limit-field">
      <label for="child-export-limit">Children per batch</label>
      <input
        id="child-export-limit"
        type="number"
        formControlName="limit"
        min="1"
        max="100"
        step="1"
        (input)="resetPagination()"
        [attr.aria-invalid]="exportForm.controls.limit.invalid"
        aria-describedby="child-export-limit-help child-export-limit-error"
      />
      <small id="child-export-limit-help">Choose between 1 and 100 children.</small>
      @if (
        exportForm.controls.limit.invalid &&
        (exportForm.controls.limit.dirty || exportForm.controls.limit.touched)
      ) {
        <small id="child-export-limit-error" class="validation-error">
          Limit must be a whole number between 1 and 100.
        </small>
      }
    </div>

    <div class="export-actions">
      <button
        type="submit"
        class="btn-primary"
        [disabled]="exportForm.invalid || inProgress()"
      >
        {{ inProgress() ? 'Exporting...' : 'Download first batch' }}
      </button>
      <button
        type="button"
        class="btn-secondary"
        [disabled]="!nextCursor() || inProgress()"
        (click)="downloadNextBatch()"
      >
        Download next batch
      </button>
    </div>
  </form>

  @if (status(); as exportStatus) {
    <p
      class="export-status"
      [class.success]="exportStatus.kind === 'success'"
      [class.error]="exportStatus.kind === 'error'"
      aria-live="polite"
    >
      {{ exportStatus.text }}
    </p>
  }
</section>
